name: smoke

# End-to-end smoke run: build the deployable server image, bring up the whole
# stack (pipeline + Keycloak + Caddy + NATS JetStream + scripted model) and
# assert the behaviours a static test cannot reach - a token over TLS, a plan
# ingested and approved by its owner and refused to a stranger, one story
# dispatched on the scripted model and landed, exactly one notification across
# the broker, and nothing lost or duplicated when the pipeline restarts.
#
# This job is the grade for `docker build` and `docker compose up`: unit tests
# read those files as text, and only a daemon can execute them.
#
# Every action is pinned to a full commit SHA with the release it came from in a
# trailing comment: a tag can be re-pointed at any commit, so `@v4` is not a pin.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege: the job reads this repository and nothing else. No token is
# written by the run, so contents:read is the whole grant.
permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    name: compose stack + smoke run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Throwaway values, valid only inside this job. They exist so the realm
      # and the pipeline agree; none of them is a real credential, and none is
      # written to a log. A deployment supplies these from its secret store.
      KEYCLOAK_ADMIN: smoke-admin
      KEYCLOAK_ADMIN_PASSWORD: smoke-admin-password
      PIPELINE_DASHBOARD_CLIENT_SECRET: smoke-dashboard-secret
      PIPELINE_MCP_CLIENT_SECRET: smoke-mcp-secret
      PIPELINE_SMOKE_USER_CLIENT_SECRET: smoke-user-secret
      PIPELINE_SMOKE_OWNER_PASSWORD: smoke-owner-password
      PIPELINE_SMOKE_STRANGER_PASSWORD: smoke-stranger-password
      COMPOSE_FILE: deploy/compose.yaml
      SMOKE_BASE_URL: https://localhost:8443
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Bring the stack up
        run: docker compose -f "$COMPOSE_FILE" up -d --wait --wait-timeout 300

      - name: Run the smoke assertions
        run: bash deploy/smoke/smoke.sh

      - name: Dump container logs
        if: always()
        run: docker compose -f "$COMPOSE_FILE" logs --no-color --tail 500

      - name: Tear the stack down
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down --volumes

name: Scorecard

# OpenSSF Scorecard: scores this repository's supply-chain practices (pinned
# dependencies, token permissions, review requirements, ...) and publishes the
# result to the public scorecard API, where the README badge reads it. Free on a
# public repository.
#
# Every `uses:` is pinned to a full 40-character commit SHA (a tag is a mutable
# ref). tests/unit/test_scorecard_workflow.py enforces that pinning and the
# exact permission set below: `id-token: write` is what lets the action
# authenticate its published result, and `security-events: write` is what lets
# the SARIF upload land in code scanning. Nothing else is granted.

on:
  push:
    branches: [master]
  schedule:
    - cron: "41 6 * * 1"

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The action reads the repository; it never pushes, so the checkout
          # must not leave a usable credential in .git/config.
          persist-credentials: false

      - name: Run the analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the SARIF results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif

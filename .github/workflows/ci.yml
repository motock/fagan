name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # Run the real full suite. `--override-ini=testpaths=` defeats the
        # pyproject.toml testpaths allowlist, which is a pinned file list that
        # silently skips any new test_*.py added to the repo root. Without this
        # override, CI (and the merge gate that requires green CI) never run
        # new files, so an incomplete change whose only failing tests are in a
        # new file merges red to master (PR #197). `--ignore=tests` keeps the
        # benchmark/experiments dir out of collection.
        run: pytest -q --override-ini=testpaths=. --ignore=tests

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ruff check
        run: ruff check .

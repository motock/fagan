<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Agent Pipeline Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Agent Pipeline Dashboard</h1>
    <div class="header-right">
      <span id="refresh-indicator" class="refresh-indicator" aria-live="polite"></span>
      <span id="last-updated"></span>
      <!-- auto-refresh removed -->
      <button id="theme-toggle" class="theme-toggle" type="button"
              aria-label="Toggle color theme" title="Toggle color theme">
        <span class="icon-sun" aria-hidden="true">☀</span>
        <span class="icon-moon" aria-hidden="true">☾</span>
      </button>
    </div>
  </header>

<div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <div id="usage-banner" class="usage-banner hidden"></div>

  <main>
    <nav id="plan-list" aria-label="Plans"></nav>

    <section id="plan-detail">
      <p class="empty-state">Select a plan to see its story lifecycle.</p>
    </section>

    <section id="comms-view" class="hidden">
      <div class="comms-head">
        <div class="comms-title">
          <span class="on-air" id="on-air"></span>
          <div>
            <div class="label">Comms</div>
            <div class="comms-sub" id="comms-sub">chat</div>
          </div>
        </div>
      </div>
      <div class="comms-body" id="comms-body">
        <div class="comms-thread" id="comms-thread" style="display:none;"></div>
        <div class="comms-landing" id="comms-landing">
          <h3>Ask the tower.</h3>
          <p>Describe a goal to draft a plan, ask what's blocked or why a
          story failed, or answer a decision the overlord is waiting on.
          Every action still runs through the same gated API the board
          buttons call.</p>
        </div>
      </div>
      <div class="comms-foot">
        <div class="comms-input-row">
          <textarea class="comms-input" id="comms-input" rows="1"
            placeholder="Ask about a plan, describe a goal, or answer a decision..."></textarea>
          <button class="comms-send" id="comms-send" type="button">Transmit</button>
        </div>
      </div>
    </section>
  </main>

  <div id="story-modal" class="modal hidden dsh-modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <button id="story-modal-close" class="modal-close" aria-label="Close">&times;</button>
      <div id="story-modal-body"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>

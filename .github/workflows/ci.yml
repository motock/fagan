name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # macOS catches macOS-only fixture dependencies (e.g. `plutil`) that
        # pass every local and ubuntu gate and fail only after the PR is open
        # (observed live 2026-07-30). Dispatch, the check_story_status done-bar
        # and the merge-gate reverify all run on macOS, so this leg is the only
        # pre-PR signal for that class of break. Restricted to ONE Python
        # version: the point is platform coverage, not another version sweep.
        exclude:
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
    env:
      # Point AGENTS_DIR at the repo's checked-in personas (agents/*.md) so
      # tests that load a persona (e.g. code-reviewer) resolve without a
      # local ~/.claude/agents install.
      AGENTS_DIR: ${{ github.workspace }}/agents
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: some tests assert against historical commits via
          # `git show <sha>~1:...`, which a shallow (fetch-depth: 1) clone
          # cannot resolve.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Configure git identity
        # Several tests drive `git commit` in a temp repo, which falls back to
        # the global identity. A fresh runner has none, so commits exit 128.
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Install nats-server
        # The NATS JetStream bus tests (tests/integration/test_nats_bus.py, the
        # `nats` cases in tests/contract/test_event_bus_contract.py) run against
        # a real broker. Pinned release, verified against the checksum that
        # release publishes, so a swapped or truncated tarball fails the job
        # instead of quietly changing what the publish path is tested against.
        # Every matrix leg installs the broker: the "Run tests" step sets
        # PIPELINE_REQUIRE_NATS_TESTS=1, which turns a missing binary into a
        # failure, so a leg without it fails the job by design. Platform and
        # architecture are mapped to the matching release asset with its own
        # pinned checksum.
        env:
          NATS_SERVER_VERSION: "2.10.22"
          NATS_SHA256_LINUX_AMD64: "db0b3ccbe4cbdd3872ae7486ec4f6b0f85824632a0789f4da2e0a8518390483e"
          NATS_SHA256_DARWIN_AMD64: "e99eb01a886b5de05972445e362e48cf8ad10b45e4cd5a5592475b184f8f81c9"
          NATS_SHA256_DARWIN_ARM64: "93ce74f61a49d8fa9dfbf420e5a844e25309e429c5c8e27b54b3283d0712fcff"
        run: |
          set -euo pipefail
          case "$(uname -s)" in
            Linux) os=linux ;;
            Darwin) os=darwin ;;
            *) echo "unsupported OS: $(uname -s)" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            arm64|aarch64) arch=arm64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          key="NATS_SHA256_$(echo "${os}_${arch}" | tr '[:lower:]' '[:upper:]')"
          expected="${!key:-}"
          if [ -z "$expected" ]; then
            echo "no pinned checksum for ${os}/${arch} (${key})" >&2
            exit 1
          fi
          stem="nats-server-v${NATS_SERVER_VERSION}-${os}-${arch}"
          tarball="${stem}.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/nats-io/nats-server/releases/download/v${NATS_SERVER_VERSION}/${tarball}"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${expected}  ${tarball}" | sha256sum -c -
          else
            # macOS ships shasum, not sha256sum.
            echo "${expected}  ${tarball}" | shasum -a 256 -c -
          fi
          tar xzf "$tarball"
          echo "${PWD}/${stem}" >> "$GITHUB_PATH"

      - name: Start nats-server
        # A JetStream broker for the publish path. The broker-backed tests start
        # their own on a random port, so this one exists to prove the binary
        # works in this job and to give PIPELINE_NATS_URL a live target.
        # PIPELINE_REQUIRE_NATS_TESTS makes a missing broker binary FAIL those
        # tests rather than skip them: a broker suite that silently skips in CI
        # cannot catch a broken publish path.
        env:
          PIPELINE_REQUIRE_NATS_TESTS: "1"
        run: |
          set -euo pipefail
          nats-server -js -a 127.0.0.1 -p 4222 \
            -sd "$RUNNER_TEMP/nats-js-store" >"$RUNNER_TEMP/nats-server.log" 2>&1 &
          # Portable readiness probe: /dev/tcp is a bash-only extension and the
          # macOS runner's default shell has it disabled, so ask Python (already
          # set up by an earlier step) whether the port accepts connections.
          for _ in $(seq 1 100); do
            if python -c 'import socket,sys; s=socket.socket(); s.settimeout(0.2); sys.exit(0 if s.connect_ex(("127.0.0.1", 4222)) == 0 else 1)'; then
              echo "nats-server is listening on 127.0.0.1:4222"
              exit 0
            fi
            sleep 0.1
          done
          cat "$RUNNER_TEMP/nats-server.log"
          echo "nats-server did not start" >&2
          exit 1
          cat "$RUNNER_TEMP/nats-server.log"
          echo "nats-server did not start" >&2
          exit 1

      - name: Run tests
        # Run the real full suite. `--override-ini=testpaths=` defeats the
        # pyproject.toml testpaths allowlist, which is a pinned file list that
        # silently skips any new test_*.py added anywhere pytest would
        # otherwise collect it from. Without this override, CI (and the merge
        # gate that requires green CI) never run new files, so an incomplete
        # change whose only failing tests are in a new file merges red to
        # master (PR #197). Unit tests live under tests/unit/; --ignore keeps
        # the benchmark/experiments dirs (which aren't correctness suites) out
        # of collection. `-n auto` now comes from pyproject.toml's addopts by
        # default, so it's not repeated here.
        env:
          PIPELINE_REQUIRE_NATS_TESTS: "1"
        run: pytest -q --override-ini=testpaths=. --ignore=tests/benchmark --ignore=tests/experiments

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ruff check
        run: ruff check .

      - name: Check file line limits
        run: python scripts/check_line_limit.py

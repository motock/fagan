[tool.pytest.ini_options]
# tests/unit/ has no __init__.py, so pytest's own rootdir-insertion only
# ever adds tests/unit/ itself to sys.path - not the repo root two levels
# up, where the app/ and pipeline/ packages live. `python -m pytest`
# masks this (the -m flag adds cwd to sys.path itself), but the bare
# `pytest` entrypoint CI actually runs does not, so tests/unit/*.py's
# `from app import backend` etc. raised ModuleNotFoundError in CI despite
# passing locally. This is the standard pytest>=7 fix.
pythonpath = ["."]
# pytest discovery defaults to walking the cwd and collecting every file
# matching test_*.py / *_test.py. The experiment rig under
# tests/experiments/local_oracle/ intentionally drops a `test_acceptance.py`
# file into a per-arm dir at run-time (which is itself a transient git repo);
# pytest then tries to import it and fails the whole run.
#
# This now mirrors the same `--ignore` flags CI and build_detect.py pass
# explicitly, instead of a hand‑maintained file list that silently rots as
# new test files are added.
# `-n auto` (pytest-xdist) fans the suite out across all available cores by
# default, so a bare `pytest` invocation is parallel without anyone having to
# remember the flag. The suite is xdist-safe (isolated tmp_path dirs,
# ephemeral ports via _free_port(), monkeypatched env) - see 8822b38.
#
# `-m "not docker"` keeps the one real `docker build` (~160s) out of the default
# local run. CI's full-suite step passes `-m ""` to run it anyway, and
# `pytest -m docker` runs it alone.
addopts = "--ignore=tests/benchmark --ignore=tests/experiments -n auto -m \"not docker\""
# Marks the durable (broker-backed) half of the EventBus contract suite in
# tests/contract/test_event_bus_contract.py. Registering it keeps
# `pytest -W error` and the unknown-mark warning clean, and lets a run select
# or deselect the durable tier with `-m durable_bus` / `-m "not durable_bus"`
# without an nats-server on the machine.
markers = [
    "durable_bus: contract tests for durable broker-backed event buses, parametrized over durable implementations only",
    "docker: builds and runs the real container image; excluded from the default run, executed by CI and `pytest -m docker`",
]
# A test parametrized over an empty implementation list must collect without
# failing: the durable tier's cases are written once and skipped, not deleted,
# while the tree has no durable bus implementation to grade.
empty_parameter_set_mark = "skip"

[tool.ruff]
# Matches the lowest Python version in the CI matrix (.github/workflows/ci.yml)
# and the install-script floor (scripts/install_checks.py).
# Without it ruff infers a default that varies by release (0.17.0 -> py311).
target-version = "py311"

[tool.ruff.lint]
# Function complexity ceiling (added 2026-11). It measures the function itself,
# so a large function cannot be hidden by moving it into its own file.
extend-select = ["C901", "S602", "S604"]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.per-file-ignores]
# Acceptance fixtures are read-only oracle content: their worktree bytes are
# hashed against a dispatch-time digest (pipeline.oracle_gate.acceptance_digests)
# and any edit - even a pure lint fix - fails the merge gate's tamper check
# (pipeline.ci._acceptance_tampered). Style nits in these files can't be fixed
# in place without breaking that guarantee, so import-sort/format is exempted
# here instead. Only I001; other rules (undefined names, syntax) still apply.
"tests/acceptance_*.py" = ["I001"]
# Existing tests assert these sources verbatim contain `datetime.now(timezone.utc)`
# and `from datetime import datetime, timezone` (test_execution.py::TestSpawnLocal,
# test_agent_done_marker.py), so the UP017 `timezone.utc` -> `UTC` rewrite would
# break them. Exempt only that rule here rather than editing the pinned tests.
"pipeline/execution.py" = ["UP017"]
"scripts/local_agent.py" = ["UP017", "C901"]
"scripts/local_agent_oracle.py" = ["UP017", "C901"]
# pipeline/server.py re-exports many names for test monkeypatching and keeps
# `import fcntl` (asserted verbatim by test_server_module_imports_hashlib) even
# though the merge helpers that used it moved to pipeline/merge.py. F401 is
# ignored file-wide (the existing `# noqa: F401` re-export comments become
# redundant, hence RUF100 too).
"pipeline/server.py" = ["F401", "RUF100"]
# test_always_on_planner.py was split into test_always_on_planner_*.py files
# (line-count target) that import pytest fixtures (agents_dir, plan_dir,
# worktree_root) from a shared tests/unit/_always_on_planner_helpers.py
# module. Standard pytest fixture-sharing pattern: each fixture name is also
# used as a same-named test-function parameter, which ruff's F811 flags as a
# "redefinition" - a false positive, since pytest resolves the parameter to
# the imported fixture, not a real name collision.
"tests/unit/test_always_on_planner_*.py" = ["F811"]
# Same fixture-sharing pattern as above: test_dashboard.py was split into
# test_dashboard_*.py files that import the client/plan_dir pytest fixtures
# from tests/unit/_dashboard_helpers.py and use them as test-function
# parameters.
"tests/unit/test_dashboard_*.py" = ["F811"]
# Same fixture-sharing pattern as above: the CFG-B5 wiring test imports the
# client pytest fixture from tests/unit/_dashboard_helpers.py and uses it as
# a test-function parameter.
"tests/unit/test_scheduler_dashboard_fingerprint_wiring.py" = ["F811"]
# Same fixture-sharing pattern as above: test_backend.py was split into
# test_backend_*.py files that import the _clean_transport_env pytest
# fixture from tests/unit/_backend_helpers.py and use it as a test-function
# parameter.
"tests/unit/test_backend_*.py" = ["F811"]
# Same fixture-sharing pattern as above: test_pipeline_mcp_server.py was
# split into test_pipeline_mcp_server_*.py files that import the
# agents_dir/plan_dir/worktree_root/usage_state_path/_plane_disabled pytest
# fixtures from tests/unit/_pipeline_mcp_server_test_helpers.py and use them
# as test-function parameters.
"tests/unit/test_pipeline_mcp_server_*.py" = ["F811"]
# Same fixture-sharing pattern as above: test_advance_pipeline_autonomy_serialization.py
# imports the plan_dir pytest fixture from
# tests/unit/_pipeline_mcp_server_test_helpers.py and uses it as a
# test-function parameter.
"tests/unit/test_advance_pipeline_autonomy_serialization.py" = ["F811"]
# Same fixture-sharing pattern as above: test_advance_cloud_slot_exempt.py
# imports the plan_dir pytest fixture from
# tests/unit/_pipeline_mcp_server_test_helpers.py and uses it as a
# test-function parameter.
"tests/unit/test_advance_cloud_slot_exempt.py" = ["F811"]

# Over the complexity ceiling when it was added (2026-11). Remove a file when its functions are under 30; never add one.
"scripts/install_checks.py" = ["C901"]
"scripts/local_agent_oracle_tools.py" = ["C901"]
"scripts/local_agent_tools.py" = ["C901"]
"tests/**" = ["C901", "S602", "S604"]


[tool.pytest.ini_options]
# tests/unit/ has no __init__.py, so pytest's own rootdir-insertion only
# ever adds tests/unit/ itself to sys.path - not the repo root two levels
# up, where the app/ and pipeline/ packages live. `python -m pytest`
# masks this (the -m flag adds cwd to sys.path itself), but the bare
# `pytest` entrypoint CI actually runs does not, so tests/unit/*.py's
# `from app import backend` etc. raised ModuleNotFoundError in CI despite
# passing locally. This is the standard pytest>=7 fix.
pythonpath = ["."]
# pytest discovery defaults to walking the cwd and collecting every file
# matching test_*.py / *_test.py. The experiment rig under
# tests/experiments/local_oracle/ intentionally drops a `test_acceptance.py`
# file into a per-arm dir at run-time (which is itself a transient git repo);
# pytest then tries to import it and fails the whole run.
#
# This now mirrors the same `--ignore` flags CI and build_detect.py pass
# explicitly, instead of a hand‑maintained file list that silently rots as
# new test files are added.
addopts = "--ignore=tests/benchmark --ignore=tests/experiments"

[tool.ruff.lint.per-file-ignores]
# Acceptance fixtures are read-only oracle content: their worktree bytes are
# hashed against a dispatch-time digest (pipeline.oracle_gate.acceptance_digests)
# and any edit - even a pure lint fix - fails the merge gate's tamper check
# (pipeline.ci._acceptance_tampered). Style nits in these files can't be fixed
# in place without breaking that guarantee, so import-sort/format is exempted
# here instead. Only I001; other rules (undefined names, syntax) still apply.
"tests/acceptance_*.py" = ["I001"]
# pipeline/server.py re-exports many names for test monkeypatching and keeps
# `import fcntl` (asserted verbatim by test_server_module_imports_hashlib) even
# though the merge helpers that used it moved to pipeline/merge.py. F401 is
# ignored file-wide (the existing `# noqa: F401` re-export comments become
# redundant, hence RUF100 too).
"pipeline/server.py" = ["F401", "RUF100"]
